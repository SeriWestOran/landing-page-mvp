<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration - BarakaShop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="/" class="logo-link">
        <h1>BarakaShop - Administration</h1>
      </a>
      <a href="/" class="btn btn-secondary">← Retour au site</a>
    </div>
  </header>

  <main class="container admin-container">
    <!-- SECTION CONNEXION -->
    <section id="login-section" class="admin-card login-card">
      <h2>Connexion Administrateur</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-password">Mot de passe :</label>
          <input type="password" id="admin-password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error-message" style="display: none;"></p>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
    </section>

    <!-- SECTION DASHBOARD APRES LOGIN -->
    <div id="admin-section" style="display: none;">
      <div class="admin-top-bar">
        <h2>Tableau de bord</h2>
        <button id="logout-btn" class="btn btn-danger">Déconnexion</button>
      </div>

      <!-- FORMULAIRE PRODUIT -->
      <section id="product-form-section" class="admin-card">
        <h3 id="prod-form-title">Ajouter un Produit</h3>
        <form id="product-form" enctype="multipart/form-data">
          <input type="hidden" id="prod-id" name="id" />

          <div class="form-grid">
            <div class="form-group">
              <label for="prod-name">Nom du produit *</label>
              <input type="text" id="prod-name" name="name" required />
            </div>

            <div class="form-group">
              <label for="prod-price">Prix (DZD) *</label>
              <input type="number" id="prod-price" name="price" step="0.01" required />
            </div>

            <div class="form-group">
              <label for="prod-category">Catégorie *</label>
              <select id="prod-category" name="category">
                <option value="Electronique">Electronique</option>
                <option value="Vêtements">Vêtements</option>
                <option value="Maison">Maison</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <div class="form-group">
              <label for="image">Image principale</label>
              <input type="file" id="image" name="image" accept="image/*" />
            </div>

            <div class="form-group">
              <label for="gallery">Images de la galerie (optionnel)</label>
              <input type="file" id="gallery" name="gallery" accept="image/*" multiple />
            </div>
          </div>

          <div class="form-group">
            <label for="prod-description">Description</label>
            <textarea id="prod-description" name="description" rows="3"></textarea>
          </div>

          <div class="form-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" id="prod-instock" name="in_stock" checked />
              En Stock
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="prod-custom" name="is_custom" />
              Produit sur commande
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer le Produit</button>
            <button type="button" id="prod-cancel-btn" class="btn btn-secondary" style="display: none;">Annuler</button>
          </div>
        </form>
      </section>

      <!-- LISTE DES PRODUITS -->
      <section class="admin-card">
        <h3>Produits existants</h3>
        <div id="admin-products-list" class="admin-items-list">
          <p>Chargement des produits...</p>
        </div>
      </section>

      <!-- FORMULAIRE SERVICE -->
      <section class="admin-card">
        <h3 id="serv-form-title">Ajouter un Service</h3>
        <form id="service-form" enctype="multipart/form-data">
          <input type="hidden" id="serv-id" name="id" />

          <div class="form-grid">
            <div class="form-group">
              <label for="serv-title">Titre du service *</label>
              <input type="text" id="serv-title" name="title" required />
            </div>

            <div class="form-group">
              <label for="serv-image">Image du service</label>
              <input type="file" id="serv-image" name="image" accept="image/*" />
            </div>
          </div>

          <div class="form-group">
            <label for="serv-description">Description</label>
            <textarea id="serv-description" name="description" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer le Service</button>
            <button type="button" id="serv-cancel-btn" class="btn btn-secondary" style="display: none;">Annuler</button>
          </div>
        </form>
      </section>

      <!-- LISTE DES SERVICES -->
      <section class="admin-card">
        <h3>Services existants</h3>
        <div id="admin-services-list" class="admin-items-list">
          <p>Chargement des services...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
