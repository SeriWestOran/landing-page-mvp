<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  
  <!-- Open Graph Dynamique -->
  <meta property="og:type" content="product" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:url" content="{{OG_URL}}" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-content">
      <a href="/" class="logo">BarakaShop <span>محل البركة</span></a>
      <a id="fb-header-link" href="https://facebook.com" target="_blank" class="btn btn-fb" rel="noopener">
        <i class="fab fa-facebook"></i> Suivre sur Facebook
      </a>
    </div>
  </header>

  <main class="product-page wrap" id="product-container">
    <a class="breadcrumb" href="/">&larr; Retour au catalogue</a>
    
    <div class="product-detail">
      <div class="product-media">
        <div class="image">
          <img id="main-product-image" src="/images/placeholder-1.svg" alt="Image du produit">
        </div>
        <div class="product-gallery" id="product-gallery">
          <!-- Vignettes générées dynamiquement -->
        </div>
      </div>

      <div class="info">
        <span class="category-badge" id="product-category">Catalogue</span>
        <h1 id="product-title">Chargement du produit...</h1>
        <p class="price" id="product-price">-- DZD</p>

        <div class="description-box">
          <h3>Description du produit</h3>
          <div class="desc" id="product-description">Veuillez patienter...</div>
        </div>

        <div class="actions">
          <a id="btn-whatsapp" href="#" target="_blank" rel="noopener" class="btn btn-primary">
            <i class="fab fa-whatsapp"></i> Commander sur WhatsApp
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span id="footer-contact">Une question ? Écrivez-nous sur Facebook.</span>
      <a id="fb-footer-link" href="#" target="_blank" rel="noopener">facebook.com</a>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
