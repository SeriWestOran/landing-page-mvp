<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — Baraka Shop</title>
  
  <!-- Balises Open Graph pour Facebook & Réseaux Sociaux -->
  <meta property="og:type" content="product" />
  <meta property="og:title" content="Baraka Shop — Produit" />
  <meta property="og:description" content="Découvrez nos articles chez Baraka Shop." />
  <meta property="og:image" content="https://barakashopaadl.onrender.com/images/placeholder-1.svg" />
  <meta property="og:url" content="https://barakashopaadl.onrender.com" />

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-content">
      <a href="/" class="logo">BarakaShop <span>محل البركة</span></a>
      <a href="https://facebook.com" target="_blank" class="btn btn-fb"><i class="fab fa-facebook"></i> Suivre sur Facebook</a>
    </div>
  </header>

  <main class="product-page wrap" id="product-container">
    <a class="breadcrumb" href="/">&larr; Retour au catalogue</a>
    
    <div class="product-detail">
      <div class="product-gallery">
        <div class="image">
          <img id="main-product-image" src="/images/placeholder-1.svg" alt="Image du produit">
        </div>
        <div class="thumbnails" id="product-thumbnails">
          <!-- Les images secondaires s'afficheront ici -->
        </div>
      </div>

      <div class="info">
        <span class="category-badge" id="product-category">Catalogue</span>
        <h1 id="product-name">Chargement du produit...</h1>
        <p class="price" id="product-price">-- DZD</p>

        <div class="description-box">
          <h3>Description du produit</h3>
          <div class="desc" id="product-description">Veuillez patienter pendant le chargement des détails du produit.</div>
        </div>

        <div class="actions">
          <a id="btn-whatsapp" href="#" target="_blank" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Commander sur WhatsApp
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Récupération de l'ID depuis /produit/5 ou /produit.html?id=5
      const pathSegments = window.location.pathname.split('/');
      let productId = pathSegments[pathSegments.length - 1];

      if (!productId || isNaN(productId)) {
        const urlParams = new URLSearchParams(window.location.search);
        productId = urlParams.get('id');
      }

      if (!productId) {
        document.getElementById('product-name').textContent = 'Produit introuvable';
        return;
      }

      try {
        const response = await fetch(`/api/products/${productId}`);
        if (!response.ok) throw new Error('Produit non trouvé');
        
        const product = await response.json();

        document.title = `${product.name} — Baraka Shop`;
        document.getElementById('product-name').textContent = product.name;
        document.getElementById('product-price').textContent = `${product.price} DZD`;
        document.getElementById('product-category').textContent = product.category || 'Général';
        document.getElementById('product-description').innerText = product.description || 'Aucune description disponible.';

        // Image principale
        const mainImg = document.getElementById('main-product-image');
        const mainUrl = product.image_url || '/images/placeholder-1.svg';
        mainImg.src = mainUrl;
        mainImg.alt = product.name;

        // Galerie d'images secondaires
        const thumbnailsContainer = document.getElementById('product-thumbnails');
        thumbnailsContainer.innerHTML = '';

        let allImages = [mainUrl];
        if (product.images && Array.isArray(product.images)) {
          product.images.forEach(img => {
            if (img.image_url && !allImages.includes(img.image_url)) {
              allImages.push(img.image_url);
            }
          });
        }

        if (allImages.length > 1) {
          allImages.forEach((imgUrl, idx) => {
            const thumb = document.createElement('img');
            thumb.src = imgUrl;
            thumb.className = `thumbnail ${idx === 0 ? 'active' : ''}`;
            thumb.onclick = () => {
              mainImg.src = imgUrl;
              document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');
            };
            thumbnailsContainer.appendChild(thumb);
          });
        }

        // WhatsApp Link
        const phone = "213779991160"; 
        const message = encodeURIComponent(`Bonjour, je souhaite commander le produit : ${product.name} (${window.location.href})`);
        document.getElementById('btn-whatsapp').href = `https://wa.me/${phone}?text=${message}`;

      } catch (err) {
        console.error(err);
        document.getElementById('product-name').textContent = 'Erreur de chargement du produit';
      }
    });
  </script>
</body>
</html>
