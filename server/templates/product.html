<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>

  <!-- Open Graph / Meta Facebook -->
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}" />
  <meta property="og:url" content="{{OG_URL}}" />

  <!-- Lien vers le style CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <h1 class="logo"><a href="/">BarakaShop</a></h1>
    </div>
  </header>

  <main class="container">
    <a href="/" class="back-link">&larr; Retour au catalogue</a>

    <div id="product-container" class="product-detail-layout">
      <!-- Media : Photo principale + Galerie -->
      <div class="product-media">
        <div class="main-image-wrapper">
          <img id="main-product-image" src="{{OG_IMAGE}}" alt="{{OG_TITLE}}">
        </div>
        <div id="product-gallery" class="product-gallery"></div>
      </div>

      <!-- Détails du produit -->
      <div class="product-info">
        <span id="product-category" class="badge"></span>
        <h1 id="product-title">{{OG_TITLE}}</h1>
        <div id="product-price" class="price"></div>
        <p id="product-description" class="description">{{OG_DESCRIPTION}}</p>
      </div>
    </div>
  </main>

  <script src="/js/product.js"></script>
</body>
</html>
